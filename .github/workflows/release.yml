name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        # The installer derives archive names from `uname -sm`, so the two
        # must agree.
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: better-diffs_darwin_arm64.tar.gz
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: better-diffs_darwin_amd64.tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: better-diffs_linux_amd64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: better-diffs_linux_arm64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: better-diffs_windows_amd64.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: better-diffs_windows_arm64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      # Linux links against musl so one static binary runs on any distro,
      # including those without glibc.
      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Resolve the version
        shell: bash
        run: echo "BETTER_DIFFS_VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive as tar.gz
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release better-diffs

      - name: Archive as zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path target/${{ matrix.target }}/release/better-diffs.exe
          -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: cli/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The installer reads this file to verify a download, looking the
      # archive up by the name in the second column.
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*
